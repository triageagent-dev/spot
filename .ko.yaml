# ko build configuration. The image is the Go binary on a distroless static
# base (CA certificates, no shell). No Docker is involved.
defaultBaseImage: gcr.io/distroless/static@sha256:18f4cc26c9ffa7f20a359298be7deadac5c607c8e03a02b8119f1a5fc2f82c99
defaultPlatforms:
  - linux/amd64
builds:
- id: tria-spot
  main: ./cmd/tria-spot
  env:
  - CGO_ENABLED=0
  flags:
  - -trimpath
  ldflags:
  - -s -w
  - -X main.version={{.Env.VERSION}}
  - -X main.gitCommit={{.Env.GIT_COMMIT}}
  - -X main.buildDate={{.Env.BUILD_DATE}}
