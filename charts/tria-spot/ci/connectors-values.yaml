# Placeholder values for `helm lint` and `helm template`. Not for installing.
spot:
  enabled: true
  tenant: example
core:
  identity: secret
  mcpUrl: https://core.example-core.svc/mcp
  tokenSecret:
    name: example-spot-core-token
anthropic:
  auth: federation
  federation:
    ruleId: fdrl_example
    organizationId: 00000000-0000-0000-0000-000000000000
    serviceAccountId: svac_example
agent:
  persistent: true
connectors:
  - name: example-kube
    url: http://tools.example-conn.svc:8084/mcp
    tools: [k8s_get_resources, k8s_describe_resource, k8s_get_pod_logs]
    hint: The workspace's cluster, read-only.
    egress:
      namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: example-conn}
      podSelector:
        matchLabels: {app.kubernetes.io/name: tools}
      ports: [8084]
networkPolicy:
  core:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: example-core}
    podSelector:
      matchLabels: {app.kubernetes.io/name: core}
