# Placeholder values for `helm lint` and `helm template`. Not for installing.
# The Temporal engine against Temporal Cloud with the payloads kept in the pod:
# an API key from a Secret mounted as a file, and no content sent to the service.
spot:
  enabled: true
  tenant: example
core:
  identity: secret
  mcpUrl: https://core.example-core.svc/mcp
  tokenSecret:
    name: example-spot-core-token
llm:
  provider: gemini
  auth: vertex
  effort: low
  vertex:
    project: example-project
engine:
  type: temporal
  temporal:
    address: example-namespace.example.tmprl.cloud:7233
    namespace: example-namespace.example
    apiKeySecret:
      name: example-spot-temporal-api-key
    localPayloads: true
    maxTasks: 5
networkPolicy:
  core:
    podSelector:
      matchLabels: {app.kubernetes.io/name: core}
  google:
    cidrs: [199.36.153.8/30]
  temporal:
    cidrs: [192.0.2.0/24]
