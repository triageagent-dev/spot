# Placeholder values for `helm lint` and `helm template`. Not for installing.
# Key mode with the model settings spelled out.
spot:
  enabled: true
  tenant: example
core:
  identity: secret
  mcpUrl: https://core.example-core.svc/mcp
  tokenSecret:
    name: example-spot-core-token
llm:
  auth: key
  model: claude-opus-5-5
  effort: high
  maxSteps: 25
  keySecret:
    name: example-spot-llm-key
    key: api-key
agent:
  toolTimeout: 30s
  toolResultMaxBytes: 16384
networkPolicy:
  core:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: example-core
    podSelector:
      matchLabels:
        app.kubernetes.io/name: core
