# Placeholder values for `helm lint` and `helm template`. Not for installing.
spot:
  enabled: true
  tenant: example
core:
  identity: secret
  mcpUrl: https://core.example-core.svc/mcp
  tokenSecret:
    name: example-spot-core-token
llm:
  auth: federation
  federation:
    ruleId: fdrl_example
    orgId: 00000000-0000-0000-0000-000000000000
    serviceAccountId: svac_example
    workspaceId: wrkspc_example
networkPolicy:
  core:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: example-core
    podSelector:
      matchLabels:
        app.kubernetes.io/name: core
