# Placeholder values for `helm lint` and `helm template`. Not for installing.
spot:
  enabled: true
  tenant: example
core:
  mcpUrl: https://core.example-core.svc/mcp
  tokenSecret:
    name: example-spot-core-token
anthropic:
  auth: federation
  federation:
    ruleId: fdrl_example
    organizationId: 00000000-0000-0000-0000-000000000000
    serviceAccountId: svac_example
agent:
  dailyCostCeilingUSD: 10
  maxContextTokens: 60000
telemetry:
  enabled: true
  endpoint: http://collector.example-obs.svc:4318
  tokenSecret:
    name: example-spot-otel-token
networkPolicy:
  core:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: example-core}
    podSelector:
      matchLabels: {app.kubernetes.io/name: core}
  telemetry:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: example-obs}
    podSelector:
      matchLabels: {app.kubernetes.io/name: collector}
  apiServer:
    cidrs: [10.0.0.1/32]
