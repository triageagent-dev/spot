# The Tria spot (ADR-095, ADR-098). Everything below renders nothing until
# spot.enabled is true.

spot:
  # Off in the chart. Setting it to true starts a model-driven agent that
  # sends what it reads from the cluster to the model API; a tenant accepts
  # that before this is on for it.
  enabled: false
  # The tenant this spot works for (required when enabled). The spot is named
  # "<tenant>-spot" unless name is set.
  tenant: ""
  name: ""
  # The name the messenger shows for the spot. The workspace's owner sets it in
  # the core and the spot reads it from there (get_spot_identity), so this
  # is only the fallback for a core that cannot say, and until it has. The spot
  # also answers to name. Empty = name.
  chatName: ""

image:
  repository: ghcr.io/triageagent-dev/spot
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The core's MCP endpoint and how this spot proves who it is to the core. Two
# identities; the one not in use needs no values and mounts nothing extra.
core:
  mcpUrl: ""         # e.g. https://<core-service>.<namespace>.svc/mcp (required)
  # The core's HTTP API, for its trigger stream: a websocket the core writes
  # to when issues change or a room has a message, so the spot reads the core
  # then and not on a timer (agent.pollInterval is only the fallback while the
  # stream is down). Empty = poll only. Add its port to networkPolicy.core.ports.
  apiUrl: ""         # e.g. http://<core-api-service>.<namespace>.svc:8080
  # serviceAccount: the spot's own ServiceAccount, presented as a projected
  #   token with audience core.audience; the core validates it by TokenReview and
  #   resolves the grants from a Role and RoleBinding in ITS OWN namespace. No
  #   Secret is mounted for the core. The core only accepts ServiceAccounts of
  #   its own namespace, so in this mode the chart MUST be installed in the
  #   core's namespace.
  # secret: a static bearer token from a Secret (core.tokenSecret), a machine
  #   identity with r and w on one tenant and no x, i, v: ADR-051. The spot can
  #   live in any namespace.
  identity: serviceAccount
  audience: triage-core          # identity: serviceAccount. The audience the core checks
  tokenExpirationSeconds: 3600   # identity: serviceAccount. The kubelet rotates the token at 80% of this; minimum 600
  rbac:
    # identity: serviceAccount. Render the Role (<spot name>-core) and the
    # RoleBinding (<spot name>-core, label triageagent.dev/managed: "true") in
    # the release namespace that grant this ServiceAccount access to the tenant.
    # false = the grant is made elsewhere. Ignored when identity is secret.
    create: true
  # identity: serviceAccount. Verbs on the tenant, from get, list, create,
  # update, execute, ingest, voice, observe. The default is the ADR-051 grant
  # (no execute, ingest, voice).
  verbs: [get, list, create, update]
  tokenSecret:                   # identity: secret (required then); ignored otherwise
    name: ""         # Secret name only; mounted as a file, never an env var
    key: token

# The model the spot calls, and how it authenticates. Two providers behind the
# same loop, and up to three auth modes; the ones not in use need no values and
# mount nothing.
llm:
  # anthropic: Claude. Auth key, federation or vertex.
  # gemini: Gemini. Auth key or vertex (federation is an Anthropic mode).
  provider: anthropic
  # key: a static API key from a Secret, read from a file (keySecret for
  #   anthropic, geminiKeySecret for gemini). Gemini re-reads it on every request.
  # federation: Anthropic Workload Identity Federation. A projected
  #   ServiceAccount token is exchanged for a short-lived access token; no
  #   Secret is mounted.
  # vertex: Claude or Gemini on Google Vertex AI through the pod's Workload
  #   Identity (Application Default Credentials). Annotate serviceAccount for
  #   it, and set networkPolicy.google.cidrs.
  auth: key
  # The model id, on Vertex AI too, with no prefix. Empty = the provider's
  # default: claude-opus-5-5 for anthropic, gemini-2.5-flash for gemini.
  model: ""
  effort: medium               # low | medium | high | xhigh | max
  maxSteps: 40                 # model requests per wake
  keySecret:                   # provider anthropic, auth: key. Secret name only; mounted as a file
    name: ""
    key: key
  geminiKeySecret:             # provider gemini, auth: key. Secret name only; mounted as a file at /secrets/gemini/<key>
    name: ""
    key: key
  federation:                  # auth: federation. None of these ids is a secret
    ruleId: ""                 # fdrl_...
    orgId: ""
    serviceAccountId: ""       # svac_...
    workspaceId: ""            # wrkspc_...; optional when the rule spans one workspace
    audience: https://api.anthropic.com
    tokenExpirationSeconds: 600  # the kubelet rotates the token at 80% of this; minimum 600
  vertex:                      # auth: vertex, either provider
    project: ""                # the Google Cloud project that serves the model
    region: global             # the Vertex AI region, or global

# Connectors: more MCP servers beside the core. Each is a service that holds
# its own credentials and limits (a Kubernetes tool server for another
# cluster, a code host, a metrics API); the spot carries no credential for it.
# The spot may call only the tools named here, by exact name, and its prompt
# gets the hint. Where the connector lives goes in egress, so the NetworkPolicy
# opens exactly that.
connectors: []
  # - name: example-kube                       # lowercase letters, digits, dashes; not core or ego
  #   url: http://tools.example.svc:8084/mcp   # streamable HTTP
  #   tools: [k8s_get_resources, k8s_describe_resource]   # required: the tool names the spot may call
  #   hint: The workspace's cluster, read-only.
  #   egress:                                  # same shape as networkPolicy.core
  #     namespaceSelector: {}
  #     podSelector: {}
  #     cidrs: []
  #     ports: [8084]

# The spot's own OpenTelemetry spans (one per wake, per model request and per
# tool call), sent to an OTLP/HTTP endpoint such as ego. The sender's token is a
# Secret mounted as a file and read at every export; no variable carries it.
# Spans hold names, timings and token counts; toolDetails adds tool arguments
# and results. Prompts and answers are added only by agent.logContent.
telemetry:
  enabled: false
  endpoint: ""                 # e.g. http://<service>.<namespace>.svc:4318
  tenant: ""                   # the tenant label of the spans in ego; empty = the spot's name, so each spot is its own tenant (letters, digits, dots, dashes, underscores)
  tenantName: ""               # the text ego shows for that tenant (ego.tenant.name, at most 80 characters, kept from the first span); empty = the label
  tenantAttr: triage.tenant    # the attribute ego reads the label from (ego's --usage-tenant-attr)
  mcpUrl: ""                   # ego's MCP endpoint (e.g. http://<service>.<namespace>.svc:8001/mcp); with it the spot reads sessions, usage and findings through the same token. Add its port to networkPolicy.telemetry.ports
  tokenSecret:
    name: ""
    key: token
  toolDetails: false

# Supervisor settings (see the README for each flag).
agent:
  coreTools: curated          # curated: the tools the loop names, destructive ones (resolve_issue, forget_issue, ...) refused; all: every core tool, bounded by core.verbs
  minWake: 2m
  maxWake: 2h
  pollInterval: 30s
  edgeCooldown: 1m
  chatBatch: 10m              # how long a person's message that does not name the spot waits; 0s = every message wakes it
  maxEdgeWakesPerHour: 12     # early wakes (edges, messages) per hour; 0 = no cap
  turnTimeout: 20m
  toolTimeout: 60s            # one tool call; past it the model gets an error result
  toolResultMaxBytes: 32768   # a longer tool result is cut, and says how much was dropped
  dailyTokenCeiling: 2000000  # tokens per UTC day (input, output, cache creation); 0 = no ceiling
  logLevel: info              # debug | info | warn | error
  # Logs carry what happened, never what was said: no message, issue or model
  # text at any level. true lets debug logs include it (tool input and the
  # model's text) and puts the first prompt and the final text on the root span.
  logContent: false
  heartbeatId: ""             # default system2-heartbeat-<tenant>

# /state: the token ledger, the room cursors and the status file. The spot's
# memory is the core's; a pod that starts with this empty starts fresh, which is
# harmless.
persistence:
  size: 256Mi
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# The pod's own ServiceAccount: the subject of Workload Identity Federation or
# of the Vertex AI Workload Identity binding (annotations) and, with
# core.identity serviceAccount, of the core grant. It holds no
# cluster RBAC: the spot reaches a cluster only through a connector, and its
# token is not mounted (automountServiceAccountToken is false).
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Egress limited to DNS, the model API, the core, the connectors and the
# telemetry endpoint. NetworkPolicy has no host names: the Anthropic CIDRs are
# the ones Anthropic publishes for its API, and the Google and cluster-specific
# ones are yours to fill in.
networkPolicy:
  enabled: true
  dns:
    namespaceLabel: kube-system   # namespace of the cluster DNS (kubernetes.io/metadata.name)
  anthropic:                      # llm.provider anthropic with llm.auth key or federation
    cidrs:
      - 160.79.104.0/23
      - 2607:6bc0::/48
    ports: [443]
  google:                         # llm.provider gemini (any auth), or llm.auth vertex
    # The addresses of the Google APIs the pod reaches (the Gemini API, Vertex
    # AI, the token endpoints). Required then: NetworkPolicy has no host names,
    # so name the ranges your network uses, for example Private Google Access.
    cidrs: []
    ports: [443]
    # llm.auth vertex. The node's metadata server, which hands out the Workload
    # Identity token (GKE's addresses and ports).
    metadata:
      cidrs: [169.254.169.252/32, 169.254.169.254/32]
      ports: [988, 80]
  core:
    # Select where the core's MCP endpoint lives: a pod/namespace selector pair
    # for an in-cluster core, or CIDRs for one outside. A selector left empty is
    # not rendered; a podSelector alone selects pods in the spot's own namespace
    # (the core's namespace when core.identity is serviceAccount).
    namespaceSelector: {}         # e.g. {matchLabels: {kubernetes.io/metadata.name: <core-namespace>}}
    podSelector: {}               # e.g. {matchLabels: {app.kubernetes.io/name: <core>}}
    cidrs: []
    ports: [443]
  telemetry:
    # Where the telemetry endpoint lives (required when telemetry.enabled): the
    # same shape as core above, and rendering fails when none of the selectors
    # and cidrs is set. Rendered only when telemetry.enabled is true.
    namespaceSelector: {}
    podSelector: {}
    cidrs: []
    ports: [4318]
