{{- if and .Values.spot.enabled (eq (include "tria-spot.runtime" .) "deployment") }}
{{- $name := include "tria-spot.name" . }}
{{- $tenant := include "tria-spot.tenant" . }}
{{- $llm := .Values.llm }}
{{- $provider := $llm.provider }}
{{- if not (has $provider (list "anthropic" "gemini")) }}{{ fail "llm.provider must be anthropic or gemini" }}{{ end }}
{{- $auth := $llm.auth }}
{{- if not (has $auth (list "key" "federation" "vertex" "gateway")) }}{{ fail "llm.auth must be key, federation, vertex or gateway" }}{{ end }}
{{- if and (eq $provider "gemini") (has $auth (list "federation" "gateway")) }}{{ fail (printf "llm.auth %s is an Anthropic auth mode: use key or vertex with llm.provider gemini" $auth) }}{{ end }}
{{- $fed := $llm.federation }}
{{- $identity := include "tria-spot.coreIdentity" . }}
{{- if and (eq $identity "serviceAccount") (lt (int64 .Values.core.tokenExpirationSeconds) 600) }}{{ fail "core.tokenExpirationSeconds must be at least 600" }}{{ end }}
{{- if eq $identity "certificate" }}
{{- if not .Values.core.apiUrl }}{{ fail "core.apiUrl is required when core.identity is certificate: the spot joins over the core's websocket" }}{{ end }}
{{- if not (regexMatch "^SHA256:[0-9a-f]{64}$" (default "" .Values.core.caFingerprint)) }}{{ fail "core.caFingerprint (SHA256:<64 lowercase hex>) is required when core.identity is certificate" }}{{ end }}
{{- end }}
{{- /* Read with dig: a release upgraded with --reuse-values may still carry the engine block of an older chart. */}}
{{- if eq (dig "engine" "type" "" .Values.AsMap) "temporal" }}{{ fail "engine.type: temporal is no longer supported: the Temporal engine was removed and the core is the spot's scheduler (the core's ADR-106). Remove the engine block from the values." }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.spot.replicas }}
  # One writer on /state at a time: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tria-spot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tria-spot.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tria-spot.saName" . }}
      # Nothing in the pod talks to the API server: the core and, in federation
      # mode, the Anthropic API each get their own projected, audience-bound
      # token below.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tria-spot
          image: {{ include "tria-spot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Flags only. Credentials are file paths; no env var carries one.
          args:
            - --tenant={{ $tenant }}
            - --name={{ $name }}
            {{- if .Values.spot.chatName }}
            - --chat-name={{ .Values.spot.chatName }}
            {{- end }}
            - --core-mcp-url={{ required "core.mcpUrl is required when spot.enabled is true" .Values.core.mcpUrl }}
            {{- if .Values.core.apiUrl }}
            - --core-api-url={{ .Values.core.apiUrl }}
            {{- end }}
            {{- if eq $identity "certificate" }}
            - --core-ca-fingerprint={{ .Values.core.caFingerprint }}
            {{- if .Values.core.enrollKeySecret.name }}
            - --enroll-key-file=/secrets/enroll/{{ .Values.core.enrollKeySecret.key }}
            {{- end }}
            {{- else }}
            - --core-token-file=/secrets/core/{{ if eq $identity "secret" }}{{ .Values.core.tokenSecret.key }}{{ else }}token{{ end }}
            {{- end }}
            - --llm-provider={{ $provider }}
            - --llm-auth={{ $auth }}
            {{- if and (eq $auth "key") (eq $provider "gemini") }}
            - --gemini-key-file=/secrets/gemini/{{ $llm.geminiKeySecret.key }}
            {{- else if eq $auth "key" }}
            - --anthropic-key-file=/secrets/anthropic/{{ $llm.keySecret.key }}
            {{- else if eq $auth "federation" }}
            - --anthropic-identity-token-file=/var/run/secrets/anthropic.com/token
            - --anthropic-federation-rule-id={{ required "llm.federation.ruleId is required when llm.auth is federation" $fed.ruleId }}
            - --anthropic-org-id={{ required "llm.federation.orgId is required when llm.auth is federation" $fed.orgId }}
            - --anthropic-service-account-id={{ required "llm.federation.serviceAccountId is required when llm.auth is federation" $fed.serviceAccountId }}
            {{- if $fed.workspaceId }}
            - --anthropic-workspace-id={{ $fed.workspaceId }}
            {{- end }}
            {{- else if eq $auth "gateway" }}
            - --llm-base-url={{ required "llm.gateway.url is required when llm.auth is gateway" $llm.gateway.url }}
            {{- else }}
            - --vertex-project={{ required "llm.vertex.project is required when llm.auth is vertex" $llm.vertex.project }}
            - --vertex-region={{ required "llm.vertex.region must not be empty" $llm.vertex.region }}
            {{- end }}
            {{- include "tria-spot.agentArgs" . | nindent 12 }}
            {{- if .Values.connectors }}
            - --connectors-file=/etc/tria-spot/connectors/connectors.json
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
            {{- if ne $identity "certificate" }}
            - name: core-token
              mountPath: /secrets/core
              readOnly: true
            {{- else if .Values.core.enrollKeySecret.name }}
            - name: enroll-key
              mountPath: /secrets/enroll
              readOnly: true
            {{- end }}
            {{- if .Values.connectors }}
            - name: connectors
              mountPath: /etc/tria-spot/connectors
              readOnly: true
            {{- end }}
            {{- if and .Values.telemetry.enabled .Values.telemetry.tokenSecret.name }}
            - name: otel-token
              mountPath: /secrets/otel
              readOnly: true
            {{- end }}
            {{- if and (eq $auth "key") (eq $provider "gemini") }}
            - name: gemini-key
              mountPath: /secrets/gemini
              readOnly: true
            {{- else if eq $auth "key" }}
            - name: anthropic-key
              mountPath: /secrets/anthropic
              readOnly: true
            {{- else if eq $auth "federation" }}
            - name: anthropic-identity
              mountPath: /var/run/secrets/anthropic.com
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" $name) .Values.persistence.existingClaim }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.connectors }}
        - name: connectors
          configMap:
            name: {{ $name }}-connectors
        {{- end }}
        {{- if and .Values.telemetry.enabled .Values.telemetry.tokenSecret.name }}
        - name: otel-token
          secret:
            secretName: {{ .Values.telemetry.tokenSecret.name }}
            defaultMode: 0440
        {{- end }}
        {{- if eq $identity "certificate" }}
        {{- /* No token for the core: the spot's key, certificate and access token live in /state/identity. */}}
        {{- if .Values.core.enrollKeySecret.name }}
        - name: enroll-key
          secret:
            secretName: {{ .Values.core.enrollKeySecret.name }}
            defaultMode: 0440
        {{- end }}
        {{- else if eq $identity "secret" }}
        - name: core-token
          secret:
            secretName: {{ required "core.tokenSecret.name is required when core.identity is secret" .Values.core.tokenSecret.name }}
            defaultMode: 0440
        {{- else }}
        # The spot's own ServiceAccount token for the core, audience-bound; the
        # kubelet writes and rotates it on disk. It is not a Secret object.
        - name: core-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.core.audience }}
                  expirationSeconds: {{ int64 .Values.core.tokenExpirationSeconds }}
                  path: token
        {{- end }}
        {{- if and (eq $auth "key") (eq $provider "gemini") }}
        - name: gemini-key
          secret:
            secretName: {{ required "llm.geminiKeySecret.name is required when llm.provider is gemini and llm.auth is key" $llm.geminiKeySecret.name }}
            defaultMode: 0440
        {{- else if eq $auth "key" }}
        - name: anthropic-key
          secret:
            secretName: {{ required "llm.keySecret.name is required when llm.auth is key" $llm.keySecret.name }}
            defaultMode: 0440
        {{- else if eq $auth "federation" }}
        # The identity token Anthropic exchanges for an access token. The kubelet
        # writes it and rotates it on disk; it is not a Secret object.
        - name: anthropic-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ $fed.audience | quote }}
                  expirationSeconds: {{ int64 $fed.tokenExpirationSeconds }}
                  path: token
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
