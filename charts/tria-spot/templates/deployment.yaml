{{- if .Values.spot.enabled }}
{{- $name := include "tria-spot.name" . }}
{{- $tenant := include "tria-spot.tenant" . }}
{{- $auth := .Values.anthropic.auth }}
{{- if not (has $auth (list "key" "federation")) }}{{ fail "anthropic.auth must be key or federation" }}{{ end }}
{{- $fed := .Values.anthropic.federation }}
{{- $identity := include "tria-spot.coreIdentity" . }}
{{- if and (eq $identity "serviceAccount") (lt (int64 .Values.core.tokenExpirationSeconds) 600) }}{{ fail "core.tokenExpirationSeconds must be at least 600" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer on /state at a time: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tria-spot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tria-spot.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tria-spot.saName" . }}
      # Nothing in the pod talks to the API server: the core and the Anthropic
      # API each get their own projected, audience-bound token below.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tria-spot
          image: {{ include "tria-spot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Flags only. Credentials are file paths; no env var carries one.
          args:
            - --tenant={{ $tenant }}
            - --name={{ $name }}
            {{- if .Values.spot.chatName }}
            - --chat-name={{ .Values.spot.chatName }}
            {{- end }}
            - --core-mcp-url={{ required "core.mcpUrl is required when spot.enabled is true" .Values.core.mcpUrl }}
            {{- if .Values.core.apiUrl }}
            - --core-api-url={{ .Values.core.apiUrl }}
            {{- end }}
            - --core-token-file=/secrets/core/{{ if eq $identity "secret" }}{{ .Values.core.tokenSecret.key }}{{ else }}token{{ end }}
            - --anthropic-auth={{ $auth }}
            {{- if eq $auth "key" }}
            - --anthropic-key-file=/secrets/anthropic/{{ .Values.anthropic.keySecret.key }}
            {{- else }}
            - --anthropic-identity-token-file=/var/run/secrets/anthropic.com/token
            - --anthropic-federation-rule-id={{ required "anthropic.federation.ruleId is required when anthropic.auth is federation" $fed.ruleId }}
            - --anthropic-org-id={{ required "anthropic.federation.organizationId is required when anthropic.auth is federation" $fed.organizationId }}
            - --anthropic-service-account-id={{ required "anthropic.federation.serviceAccountId is required when anthropic.auth is federation" $fed.serviceAccountId }}
            {{- if $fed.workspaceId }}
            - --anthropic-workspace-id={{ $fed.workspaceId }}
            {{- end }}
            {{- end }}
            {{- if .Values.connectors }}
            - --connectors-file=/etc/tria-spot/connectors/connectors.json
            {{- end }}
            - --state-dir=/state
            - --run-dir=/run/tria-spot
            - --permission-mode={{ .Values.agent.permissionMode }}
            - --fallback-permission-mode={{ .Values.agent.fallbackPermissionMode }}
            - --min-wake={{ .Values.agent.minWake }}
            - --max-wake={{ .Values.agent.maxWake }}
            - --poll-interval={{ .Values.agent.pollInterval }}
            - --edge-cooldown={{ .Values.agent.edgeCooldown }}
            - --core-tools={{ .Values.agent.coreTools }}
            - --chat-batch={{ .Values.agent.chatBatch }}
            - --max-edge-wakes-per-hour={{ int .Values.agent.maxEdgeWakesPerHour }}
            {{- if .Values.agent.persistent }}
            - --persistent
            {{- end }}
            - --max-turns={{ .Values.agent.maxTurns }}
            - --turn-timeout={{ .Values.agent.turnTimeout }}
            - --daily-token-ceiling={{ int64 .Values.agent.dailyTokenCeiling }}
            {{- if .Values.agent.dailyCostCeilingUSD }}
            - --daily-cost-ceiling-usd={{ .Values.agent.dailyCostCeilingUSD }}
            {{- end }}
            {{- if .Values.agent.maxContextTokens }}
            - --max-context-tokens={{ int64 .Values.agent.maxContextTokens }}
            {{- end }}
            {{- if .Values.telemetry.enabled }}
            - --otel-endpoint={{ required "telemetry.endpoint is required when telemetry.enabled is true" .Values.telemetry.endpoint }}
            {{- if .Values.telemetry.tenant }}
            - --otel-tenant={{ .Values.telemetry.tenant }}
            {{- end }}
            {{- if .Values.telemetry.tenantName }}
            - --otel-tenant-name={{ .Values.telemetry.tenantName | quote }}
            {{- end }}
            - --otel-tenant-attr={{ .Values.telemetry.tenantAttr }}
            {{- if .Values.telemetry.mcpUrl }}
            - --ego-mcp-url={{ .Values.telemetry.mcpUrl }}
            {{- end }}
            {{- if .Values.telemetry.tokenSecret.name }}
            - --otel-token-file=/secrets/otel/{{ .Values.telemetry.tokenSecret.key }}
            {{- end }}
            {{- if .Values.telemetry.toolDetails }}
            - --otel-tool-details
            {{- end }}
            {{- end }}
            - --log-level={{ .Values.agent.logLevel }}
            {{- if .Values.agent.logContent }}
            - --log-content
            {{- end }}
            {{- if .Values.agent.model }}
            - --model={{ .Values.agent.model }}
            {{- end }}
            {{- if .Values.agent.heartbeatId }}
            - --heartbeat-id={{ .Values.agent.heartbeatId }}
            {{- end }}
            {{- if .Values.agent.extraAllowedTools }}
            - --allowed-tools={{ join "," .Values.agent.extraAllowedTools }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: run
              mountPath: /run/tria-spot
            - name: tmp
              mountPath: /tmp
            - name: core-token
              mountPath: /secrets/core
              readOnly: true
            {{- if .Values.connectors }}
            - name: connectors
              mountPath: /etc/tria-spot/connectors
              readOnly: true
            {{- end }}
            {{- if and .Values.telemetry.enabled .Values.telemetry.tokenSecret.name }}
            - name: otel-token
              mountPath: /secrets/otel
              readOnly: true
            {{- end }}
            {{- if eq $auth "key" }}
            - name: anthropic-key
              mountPath: /secrets/anthropic
              readOnly: true
            {{- else }}
            - name: anthropic-identity
              mountPath: /var/run/secrets/anthropic.com
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" $name) .Values.persistence.existingClaim }}
        # Rendered CLI config (it holds the core token): memory-backed, never on disk.
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.connectors }}
        - name: connectors
          configMap:
            name: {{ $name }}-connectors
        {{- end }}
        {{- if and .Values.telemetry.enabled .Values.telemetry.tokenSecret.name }}
        - name: otel-token
          secret:
            secretName: {{ .Values.telemetry.tokenSecret.name }}
            defaultMode: 0440
        {{- end }}
        {{- if eq $identity "secret" }}
        - name: core-token
          secret:
            secretName: {{ required "core.tokenSecret.name is required when core.identity is secret" .Values.core.tokenSecret.name }}
            defaultMode: 0440
        {{- else }}
        # The spot's own ServiceAccount token for the core, audience-bound; the
        # kubelet writes and rotates it on disk. It is not a Secret object.
        - name: core-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.core.audience }}
                  expirationSeconds: {{ int64 .Values.core.tokenExpirationSeconds }}
                  path: token
        {{- end }}
        {{- if eq $auth "key" }}
        - name: anthropic-key
          secret:
            secretName: {{ required "anthropic.keySecret.name is required when anthropic.auth is key" .Values.anthropic.keySecret.name }}
            defaultMode: 0440
        {{- else }}
        # The identity token Anthropic exchanges for an access token. The kubelet
        # writes it and rotates it on disk; it is not a Secret object.
        - name: anthropic-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ $fed.audience | quote }}
                  expirationSeconds: {{ int64 $fed.tokenExpirationSeconds }}
                  path: token
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
