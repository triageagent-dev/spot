{{- if .Values.spot.enabled }}
{{- $name := include "tria-spot.name" . }}
{{- $tenant := include "tria-spot.tenant" . }}
{{- $llm := .Values.llm }}
{{- $provider := $llm.provider }}
{{- if not (has $provider (list "anthropic" "gemini")) }}{{ fail "llm.provider must be anthropic or gemini" }}{{ end }}
{{- $auth := $llm.auth }}
{{- if not (has $auth (list "key" "federation" "vertex")) }}{{ fail "llm.auth must be key, federation or vertex" }}{{ end }}
{{- if and (eq $provider "gemini") (eq $auth "federation") }}{{ fail "llm.auth federation is an Anthropic auth mode: use key or vertex with llm.provider gemini" }}{{ end }}
{{- $fed := $llm.federation }}
{{- $identity := include "tria-spot.coreIdentity" . }}
{{- if and (eq $identity "serviceAccount") (lt (int64 .Values.core.tokenExpirationSeconds) 600) }}{{ fail "core.tokenExpirationSeconds must be at least 600" }}{{ end }}
{{- /* The engine's values are read with dig: a release upgraded with --reuse-values has none of the keys the chart added since. */}}
{{- $engine := dig "engine" "type" "local" .Values.AsMap }}
{{- if not (has $engine (list "local" "temporal")) }}{{ fail "engine.type must be local or temporal" }}{{ end }}
{{- $tmp := dig "engine" "temporal" dict .Values.AsMap }}
{{- $tmpAPI := dig "apiKeySecret" "name" "" $tmp }}
{{- $tmpPayload := dig "payloadKeySecret" "name" "" $tmp }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer on /state at a time: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tria-spot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tria-spot.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tria-spot.saName" . }}
      # Nothing in the pod talks to the API server: the core and, in federation
      # mode, the Anthropic API each get their own projected, audience-bound
      # token below.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tria-spot
          image: {{ include "tria-spot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Flags only. Credentials are file paths; no env var carries one.
          args:
            - --tenant={{ $tenant }}
            - --name={{ $name }}
            {{- if .Values.spot.chatName }}
            - --chat-name={{ .Values.spot.chatName }}
            {{- end }}
            - --core-mcp-url={{ required "core.mcpUrl is required when spot.enabled is true" .Values.core.mcpUrl }}
            {{- if .Values.core.apiUrl }}
            - --core-api-url={{ .Values.core.apiUrl }}
            {{- end }}
            - --core-token-file=/secrets/core/{{ if eq $identity "secret" }}{{ .Values.core.tokenSecret.key }}{{ else }}token{{ end }}
            - --llm-provider={{ $provider }}
            - --llm-auth={{ $auth }}
            {{- if and (eq $auth "key") (eq $provider "gemini") }}
            - --gemini-key-file=/secrets/gemini/{{ $llm.geminiKeySecret.key }}
            {{- else if eq $auth "key" }}
            - --anthropic-key-file=/secrets/anthropic/{{ $llm.keySecret.key }}
            {{- else if eq $auth "federation" }}
            - --anthropic-identity-token-file=/var/run/secrets/anthropic.com/token
            - --anthropic-federation-rule-id={{ required "llm.federation.ruleId is required when llm.auth is federation" $fed.ruleId }}
            - --anthropic-org-id={{ required "llm.federation.orgId is required when llm.auth is federation" $fed.orgId }}
            - --anthropic-service-account-id={{ required "llm.federation.serviceAccountId is required when llm.auth is federation" $fed.serviceAccountId }}
            {{- if $fed.workspaceId }}
            - --anthropic-workspace-id={{ $fed.workspaceId }}
            {{- end }}
            {{- else }}
            - --vertex-project={{ required "llm.vertex.project is required when llm.auth is vertex" $llm.vertex.project }}
            - --vertex-region={{ required "llm.vertex.region must not be empty" $llm.vertex.region }}
            {{- end }}
            {{- if $llm.model }}
            - --model={{ $llm.model }}
            {{- end }}
            - --effort={{ $llm.effort }}
            - --max-steps={{ int $llm.maxSteps }}
            {{- if $llm.maxToolCalls }}
            - --max-tool-calls={{ int $llm.maxToolCalls }}
            {{- end }}
            {{- if hasKey $llm "maxTurnTokens" }}
            - --max-turn-tokens={{ int64 $llm.maxTurnTokens }}
            {{- end }}
            {{- if .Values.connectors }}
            - --connectors-file=/etc/tria-spot/connectors/connectors.json
            {{- end }}
            - --state-dir=/state
            - --instruction-cell={{ .Values.agent.instructionCell }}
            - --min-wake={{ .Values.agent.minWake }}
            - --max-wake={{ .Values.agent.maxWake }}
            - --poll-interval={{ .Values.agent.pollInterval }}
            - --edge-cooldown={{ .Values.agent.edgeCooldown }}
            - --core-tools={{ .Values.agent.coreTools }}
            - --chat-batch={{ .Values.agent.chatBatch }}
            {{- if .Values.agent.notesOnly }}
            - --notes-only
            {{- end }}
            {{- if not .Values.agent.issueWakes }}
            - --issue-wakes=false
            {{- end }}
            {{- if and (hasKey .Values.agent "fastLane") (not .Values.agent.fastLane) }}
            - --fast-lane=false
            {{- end }}
            {{- if ne (int (default 8 .Values.agent.fastMaxToolCalls)) 8 }}
            - --fast-max-tool-calls={{ int .Values.agent.fastMaxToolCalls }}
            {{- end }}
            {{- if ne (int (default 120000 .Values.agent.fastMaxTurnTokens)) 120000 }}
            - --fast-max-turn-tokens={{ int .Values.agent.fastMaxTurnTokens }}
            {{- end }}
            - --max-edge-wakes-per-hour={{ int .Values.agent.maxEdgeWakesPerHour }}
            - --turn-timeout={{ .Values.agent.turnTimeout }}
            - --tool-timeout={{ .Values.agent.toolTimeout }}
            - --tool-result-max-bytes={{ int .Values.agent.toolResultMaxBytes }}
            - --daily-token-ceiling={{ int64 .Values.agent.dailyTokenCeiling }}
            - --hourly-token-ceiling={{ int64 (dig "agent" "hourlyTokenCeiling" 600000 .Values.AsMap) }}
            - --skip-quiet-wakes={{ dig "agent" "skipQuietWakes" true .Values.AsMap }}
            {{- if .Values.telemetry.enabled }}
            - --otel-endpoint={{ required "telemetry.endpoint is required when telemetry.enabled is true" .Values.telemetry.endpoint }}
            {{- if .Values.telemetry.tenant }}
            - --otel-tenant={{ .Values.telemetry.tenant }}
            {{- end }}
            {{- if .Values.telemetry.tenantName }}
            - --otel-tenant-name={{ .Values.telemetry.tenantName | quote }}
            {{- end }}
            - --otel-tenant-attr={{ .Values.telemetry.tenantAttr }}
            {{- if .Values.telemetry.mcpUrl }}
            - --ego-mcp-url={{ .Values.telemetry.mcpUrl }}
            {{- end }}
            {{- if .Values.telemetry.tokenSecret.name }}
            - --otel-token-file=/secrets/otel/{{ .Values.telemetry.tokenSecret.key }}
            {{- end }}
            - --otel-content={{ .Values.telemetry.content }}
            {{- end }}
            - --log-level={{ .Values.agent.logLevel }}
            {{- if .Values.agent.logContent }}
            - --log-content
            {{- end }}
            {{- if .Values.agent.heartbeatId }}
            - --heartbeat-id={{ .Values.agent.heartbeatId }}
            {{- end }}
            {{- if eq $engine "temporal" }}
            - --engine=temporal
            - --temporal-address={{ required "engine.temporal.address is required when engine.type is temporal" (dig "address" "" $tmp) }}
            - --temporal-namespace={{ required "engine.temporal.namespace is required when engine.type is temporal" (dig "namespace" "" $tmp) }}
            {{- if dig "taskQueue" "" $tmp }}
            - --temporal-task-queue={{ dig "taskQueue" "" $tmp }}
            {{- end }}
            {{- if dig "tls" false $tmp }}
            - --temporal-tls
            {{- end }}
            {{- if $tmpAPI }}
            - --temporal-api-key-file=/secrets/temporal/api/{{ dig "apiKeySecret" "key" "api-key" $tmp }}
            {{- end }}
            {{- if $tmpPayload }}
            - --temporal-payload-key-file=/secrets/temporal/payload/{{ dig "payloadKeySecret" "key" "key" $tmp }}
            {{- end }}
            {{- if dig "plainPayloads" false $tmp }}
            - --temporal-plain-payloads
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
            - name: core-token
              mountPath: /secrets/core
              readOnly: true
            {{- if .Values.connectors }}
            - name: connectors
              mountPath: /etc/tria-spot/connectors
              readOnly: true
            {{- end }}
            {{- if and .Values.telemetry.enabled .Values.telemetry.tokenSecret.name }}
            - name: otel-token
              mountPath: /secrets/otel
              readOnly: true
            {{- end }}
            {{- if and (eq $engine "temporal") $tmpAPI }}
            - name: temporal-api-key
              mountPath: /secrets/temporal/api
              readOnly: true
            {{- end }}
            {{- if and (eq $engine "temporal") $tmpPayload }}
            - name: temporal-payload-key
              mountPath: /secrets/temporal/payload
              readOnly: true
            {{- end }}
            {{- if and (eq $auth "key") (eq $provider "gemini") }}
            - name: gemini-key
              mountPath: /secrets/gemini
              readOnly: true
            {{- else if eq $auth "key" }}
            - name: anthropic-key
              mountPath: /secrets/anthropic
              readOnly: true
            {{- else if eq $auth "federation" }}
            - name: anthropic-identity
              mountPath: /var/run/secrets/anthropic.com
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" $name) .Values.persistence.existingClaim }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.connectors }}
        - name: connectors
          configMap:
            name: {{ $name }}-connectors
        {{- end }}
        {{- if and .Values.telemetry.enabled .Values.telemetry.tokenSecret.name }}
        - name: otel-token
          secret:
            secretName: {{ .Values.telemetry.tokenSecret.name }}
            defaultMode: 0440
        {{- end }}
        {{- if eq $identity "secret" }}
        - name: core-token
          secret:
            secretName: {{ required "core.tokenSecret.name is required when core.identity is secret" .Values.core.tokenSecret.name }}
            defaultMode: 0440
        {{- else }}
        # The spot's own ServiceAccount token for the core, audience-bound; the
        # kubelet writes and rotates it on disk. It is not a Secret object.
        - name: core-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.core.audience }}
                  expirationSeconds: {{ int64 .Values.core.tokenExpirationSeconds }}
                  path: token
        {{- end }}
        {{- if and (eq $engine "temporal") $tmpAPI }}
        - name: temporal-api-key
          secret:
            secretName: {{ $tmpAPI }}
            defaultMode: 0440
        {{- end }}
        {{- if and (eq $engine "temporal") $tmpPayload }}
        - name: temporal-payload-key
          secret:
            secretName: {{ $tmpPayload }}
            defaultMode: 0440
        {{- end }}
        {{- if and (eq $auth "key") (eq $provider "gemini") }}
        - name: gemini-key
          secret:
            secretName: {{ required "llm.geminiKeySecret.name is required when llm.provider is gemini and llm.auth is key" $llm.geminiKeySecret.name }}
            defaultMode: 0440
        {{- else if eq $auth "key" }}
        - name: anthropic-key
          secret:
            secretName: {{ required "llm.keySecret.name is required when llm.auth is key" $llm.keySecret.name }}
            defaultMode: 0440
        {{- else if eq $auth "federation" }}
        # The identity token Anthropic exchanges for an access token. The kubelet
        # writes it and rotates it on disk; it is not a Secret object.
        - name: anthropic-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ $fed.audience | quote }}
                  expirationSeconds: {{ int64 $fed.tokenExpirationSeconds }}
                  path: token
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
