{{- define "tria-spot.readRules" -}}
- apiGroups: [""]
  resources: [pods, services, endpoints, events, nodes, namespaces, persistentvolumeclaims, resourcequotas, limitranges, replicationcontrollers]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get, list]
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets, replicasets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, networkpolicies]
  verbs: [get, list, watch]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [get, list, watch]
- apiGroups: [metrics.k8s.io]
  resources: [pods, nodes]
  verbs: [get, list]
{{- end }}
{{- if and .Values.spot.enabled .Values.rbac.read.enabled }}
# READ stage. Read-only, and no Secrets or ConfigMaps. With rbac.read.namespaces
# empty it is bound cluster-wide; with a list, the workload rules are bound only
# in those namespaces and the cluster keeps just nodes and namespaces.
{{- if .Values.rbac.read.namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tria-spot.name" . }}-read
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tria-spot.name" . }}-read
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tria-spot.name" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "tria-spot.saName" . }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.rbac.read.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tria-spot.name" $ }}-read
  namespace: {{ . }}
  labels:
    {{- include "tria-spot.labels" $ | nindent 4 }}
rules:
{{ include "tria-spot.readRules" $ | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tria-spot.name" $ }}-read
  namespace: {{ . }}
  labels:
    {{- include "tria-spot.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tria-spot.name" $ }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "tria-spot.saName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tria-spot.name" . }}-read
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
rules:
{{ include "tria-spot.readRules" . | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tria-spot.name" . }}-read
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tria-spot.name" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "tria-spot.saName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
