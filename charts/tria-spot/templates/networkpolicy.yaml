{{- if and .Values.spot.enabled .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tria-spot.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tria-spot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Nothing connects to the spot.
  ingress: []
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespaceLabel }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The Anthropic API.
    - to:
        {{- range $np.anthropic.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.anthropic.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    # The core's MCP endpoint.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" $np.core "what" "core") | nindent 8 }}
      ports:
        {{- range $np.core.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- if $.Values.telemetry.enabled }}
    # The telemetry endpoint (ego): traces only.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" $np.telemetry "what" "telemetry") | nindent 8 }}
      ports:
        {{- range $np.telemetry.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    # The cluster API server (kubectl and the ServiceAccount token).
    - to:
        {{- range (required "networkPolicy.apiServer.cidrs is required when the NetworkPolicy is on" $np.apiServer.cidrs) }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.apiServer.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
