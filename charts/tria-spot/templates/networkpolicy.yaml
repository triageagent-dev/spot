{{- if and .Values.spot.enabled .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tria-spot.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tria-spot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Nothing connects to the spot.
  ingress: []
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespaceLabel }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if eq .Values.llm.auth "vertex" }}
    # Claude on Vertex AI: the Google API addresses you name, and the node's
    # metadata server that hands out the Workload Identity token.
    - to:
        {{- if not $np.vertex.cidrs }}{{ fail "networkPolicy.vertex.cidrs must list the addresses of the Google APIs the pod may reach when llm.auth is vertex" }}{{ end }}
        {{- range $np.vertex.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.vertex.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    - to:
        {{- range $np.vertex.metadata.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.vertex.metadata.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- else }}
    # The Anthropic API.
    - to:
        {{- range $np.anthropic.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.anthropic.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    # The core's MCP endpoint.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" $np.core "what" "core") | nindent 8 }}
      ports:
        {{- range $np.core.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- range $.Values.connectors }}
    # Connector {{ .name }}.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" (default dict .egress) "what" (printf "connector %s egress" .name)) | nindent 8 }}
      ports:
        {{- range (required (printf "connectors[%s].egress.ports is required" .name) (dig "egress" "ports" nil .)) }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- if $.Values.telemetry.enabled }}
    # The telemetry endpoint (ego): traces only.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" $np.telemetry "what" "telemetry") | nindent 8 }}
      ports:
        {{- range $np.telemetry.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
