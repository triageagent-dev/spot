{{- if and .Values.spot.enabled (eq (include "tria-spot.runtime" .) "deployment") .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tria-spot.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tria-spot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tria-spot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Nothing connects to the spot.
  ingress: []
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespaceLabel }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- $llm := .Values.llm }}
    {{- $google := or (eq $llm.provider "gemini") (eq $llm.auth "vertex") }}
    {{- if $google }}
    # Google's APIs: the Gemini API (provider gemini with a key), Vertex AI
    # (either provider) and the token endpoints: the addresses you name.
    - to:
        {{- if not $np.google.cidrs }}{{ fail "networkPolicy.google.cidrs must list the addresses of the Google APIs the pod may reach when llm.provider is gemini or llm.auth is vertex" }}{{ end }}
        {{- range $np.google.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.google.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- if eq $llm.auth "vertex" }}
    # Application default credentials: the node's metadata server hands out the
    # Workload Identity token.
    - to:
        {{- range $np.google.metadata.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.google.metadata.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- if and (eq $llm.provider "anthropic") (ne $llm.auth "vertex") }}
    # The Anthropic API.
    - to:
        {{- range $np.anthropic.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.anthropic.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    # The core's MCP endpoint.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" $np.core "what" "core") | nindent 8 }}
      ports:
        {{- range $np.core.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- range $.Values.connectors }}
    # Connector {{ .name }}.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" (default dict .egress) "what" (printf "connector %s egress" .name)) | nindent 8 }}
      ports:
        {{- range (required (printf "connectors[%s].egress.ports is required" .name) (dig "egress" "ports" nil .)) }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- if $.Values.telemetry.enabled }}
    # The telemetry endpoint (ego): traces only.
    - to:
        {{- include "tria-spot.egressPeers" (dict "t" $np.telemetry "what" "telemetry") | nindent 8 }}
      ports:
        {{- range $np.telemetry.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
