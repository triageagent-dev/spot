{{- if .Values.spot.enabled }}
{{- $root := . }}
{{- range .Values.actNamespaces }}
---
# ACT stage for one namespace. Deleting this Role (or the namespace from
# actNamespaces) takes the write grant back; the READ stage is unaffected.
# Pod delete and scale only. Patch on a workload would let the holder rewrite
# the pod template (mount any Secret, change the ServiceAccount), so there is
# none: "rollout restart" is not available, delete pods instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tria-spot.name" $root }}-act
  namespace: {{ . }}
  labels:
    {{- include "tria-spot.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # kubectl scale writes the scale subresource; DaemonSets have none.
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tria-spot.name" $root }}-act
  namespace: {{ . }}
  labels:
    {{- include "tria-spot.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tria-spot.name" $root }}-act
subjects:
  - kind: ServiceAccount
    name: {{ include "tria-spot.saName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
